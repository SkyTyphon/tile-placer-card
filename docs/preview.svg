<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Illustration of Tile Placer Card: draggable bubbles on a floor plan with a selection panel">
  <title>Tile Placer Card (illustration)</title>
  <rect width="800" height="480" rx="12" fill="#1f2430"/>
  <!-- floor plan -->
  <rect x="24" y="24" width="520" height="432" rx="6" fill="#2b3142" stroke="#4a5370" stroke-width="2"/>
  <line x1="24" y1="200" x2="544" y2="200" stroke="#4a5370" stroke-width="2"/>
  <line x1="300" y1="24" x2="300" y2="200" stroke="#4a5370" stroke-width="2"/>
  <line x1="360" y1="200" x2="360" y2="456" stroke="#4a5370" stroke-width="2"/>
  <!-- bubbles -->
  <g fill="#1f2430" stroke="#6b7694" stroke-width="2">
    <circle cx="150" cy="110" r="24"/>
    <circle cx="420" cy="100" r="24"/>
    <circle cx="190" cy="320" r="24"/>
    <circle cx="450" cy="330" r="24"/>
  </g>
  <!-- selected bubble -->
  <circle cx="270" cy="270" r="24" fill="#1f2430" stroke="#ffa94d" stroke-width="2"/>
  <circle cx="270" cy="270" r="31" fill="none" stroke="#03a9f4" stroke-width="3"/>
  <!-- icons (simple shapes) -->
  <g fill="#c9d1e6">
    <rect x="138" y="100" width="24" height="16" rx="2"/>
    <path d="M410 108 l10 -16 l10 16 z"/>
    <circle cx="190" cy="320" r="9"/>
    <rect x="440" y="322" width="20" height="16" rx="3"/>
  </g>
  <circle cx="270" cy="270" r="10" fill="#ffa94d"/>
  <!-- label of selected bubble -->
  <rect x="233" y="306" width="74" height="20" rx="6" fill="#3a4258"/>
  <text x="270" y="320" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#e6ebf8" text-anchor="middle">Example</text>
  <!-- drag hint -->
  <path d="M300 250 q40 -40 80 -10" fill="none" stroke="#03a9f4" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M376 232 l8 8 l-12 4 z" fill="#03a9f4"/>
  <!-- panel -->
  <rect x="568" y="24" width="208" height="432" rx="10" fill="#2b3142" stroke="#4a5370" stroke-width="2"/>
  <text x="584" y="52" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6ebf8">Selected bubble</text>
  <g font-family="Roboto, Arial, sans-serif" font-size="11" fill="#9aa5c4">
    <text x="584" y="82">Name</text>
    <text x="584" y="132">Icon</text>
    <text x="584" y="182">Entity</text>
    <text x="584" y="232">Label display</text>
    <text x="584" y="282">Size</text>
  </g>
  <g fill="#1f2430" stroke="#4a5370" stroke-width="1">
    <rect x="584" y="88" width="176" height="24" rx="6"/>
    <rect x="584" y="138" width="176" height="24" rx="6"/>
    <rect x="584" y="188" width="176" height="24" rx="6"/>
    <rect x="584" y="238" width="176" height="24" rx="6"/>
  </g>
  <line x1="584" y1="304" x2="760" y2="304" stroke="#4a5370" stroke-width="4" stroke-linecap="round"/>
  <circle cx="660" cy="304" r="8" fill="#03a9f4"/>
  <g font-family="Roboto, Arial, sans-serif" font-size="12" fill="#e6ebf8">
    <text x="592" y="105">Example</text>
    <text x="592" y="155">mdi:lightbulb</text>
    <text x="592" y="205">light.example</text>
    <text x="592" y="255">On hover</text>
  </g>
  <rect x="584" y="340" width="176" height="22" rx="6" fill="none" stroke="#4a5370"/>
  <text x="672" y="355" font-family="Roboto, Arial, sans-serif" font-size="11" fill="#9aa5c4" text-anchor="middle">Actions (tap, double tap, hold)</text>
  <rect x="584" y="410" width="80" height="28" rx="8" fill="none" stroke="#ff6b6b"/>
  <text x="624" y="428" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#ff6b6b" text-anchor="middle">Delete</text>
  <rect x="680" y="410" width="80" height="28" rx="8" fill="#03a9f4"/>
  <text x="720" y="428" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">Close</text>
</svg>
