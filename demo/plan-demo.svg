<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>Plan d'exemple pour la démo de Tile Placer Card</title>
  <rect width="1200" height="800" fill="#fbfaf7"/>
  <!-- sols -->
  <rect x="60" y="60" width="580" height="360" fill="#f1e7d3"/>
  <rect x="640" y="60" width="500" height="320" fill="#e2ecf1"/>
  <rect x="60" y="420" width="340" height="320" fill="#ebe4f0"/>
  <rect x="400" y="420" width="240" height="320" fill="#dcefe8"/>
  <rect x="640" y="380" width="240" height="360" fill="#ececec"/>
  <rect x="880" y="380" width="260" height="360" fill="#dedede"/>
  <!-- mobilier -->
  <g fill="#c9b48f" stroke="#a8946f" stroke-width="2">
    <rect x="130" y="110" width="220" height="70" rx="16"/>
    <rect x="130" y="110" width="60" height="150" rx="16"/>
    <rect x="270" y="270" width="150" height="80" rx="8" fill="#d8c8a6"/>
  </g>
  <g fill="#b8c6cf" stroke="#92a4af" stroke-width="2">
    <rect x="660" y="80" width="470" height="60" rx="6"/>
    <rect x="860" y="170" width="170" height="90" rx="8"/>
  </g>
  <g fill="#cdbfdc" stroke="#a695b8" stroke-width="2">
    <rect x="110" y="520" width="190" height="170" rx="10"/>
    <rect x="130" y="535" width="150" height="40" rx="12" fill="#e4dbee"/>
  </g>
  <g fill="#bfdcd2" stroke="#8dbbae" stroke-width="2">
    <rect x="430" y="450" width="190" height="80" rx="30"/>
    <circle cx="470" cy="660" r="26"/>
  </g>
  <g fill="#c4c4c4" stroke="#9a9a9a" stroke-width="2">
    <rect x="910" y="410" width="200" height="320" rx="10" opacity="0.5"/>
  </g>
  <!-- murs extérieurs -->
  <g fill="none" stroke="#59606b" stroke-width="10" stroke-linecap="square">
    <rect x="60" y="60" width="1080" height="680"/>
  </g>
  <!-- murs intérieurs -->
  <g stroke="#59606b" stroke-width="7" stroke-linecap="square">
    <line x1="640" y1="60" x2="640" y2="200"/>
    <line x1="640" y1="260" x2="640" y2="420"/>
    <line x1="60" y1="420" x2="320" y2="420"/>
    <line x1="380" y1="420" x2="640" y2="420"/>
    <line x1="400" y1="420" x2="400" y2="560"/>
    <line x1="400" y1="620" x2="400" y2="740"/>
    <line x1="640" y1="380" x2="640" y2="740"/>
    <line x1="640" y1="380" x2="1140" y2="380"/>
    <line x1="880" y1="380" x2="880" y2="560"/>
    <line x1="880" y1="620" x2="880" y2="740"/>
  </g>
  <!-- portes (arcs) -->
  <g fill="none" stroke="#59606b" stroke-width="3">
    <path d="M320 420 A60 60 0 0 1 380 480"/>
    <path d="M400 560 A60 60 0 0 1 460 620" stroke-dasharray="0"/>
    <path d="M640 200 A60 60 0 0 0 700 260" />
    <path d="M880 560 A60 60 0 0 1 820 620"/>
  </g>
  <!-- fenêtres -->
  <g fill="#bfe3f5" stroke="#4d8fb0" stroke-width="3">
    <rect x="150" y="54" width="140" height="14"/>
    <rect x="870" y="54" width="140" height="14"/>
    <rect x="54" y="540" width="14" height="120"/>
    <rect x="150" y="732" width="150" height="14"/>
  </g>
  <!-- porte d'entrée et porte de garage -->
  <rect x="720" y="733" width="90" height="14" fill="#8a6a45"/>
  <rect x="920" y="733" width="180" height="14" fill="#9a9a9a"/>
  <!-- noms des pièces -->
  <g font-family="Roboto, Arial, sans-serif" font-size="24" fill="#8a8f98" text-anchor="middle">
    <text x="350" y="395">Salon</text>
    <text x="890" y="355">Cuisine</text>
    <text x="230" y="715">Chambre</text>
    <text x="520" y="715">Salle de bain</text>
    <text x="760" y="715">Entrée</text>
    <text x="1010" y="715">Garage</text>
  </g>
</svg>
